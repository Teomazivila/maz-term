general:
  refresh: 5s
  theme: default
  history_retention: 7d

layout:
  - name: "System Overview"
    rows:
      - size: 1
        panels: ["cpu", "memory", "disk", "network"]
      - size: 2
        panels: ["processes"]
  
  - name: "Services"
    rows:
      - size: 1
        panels: ["service-status"]
      - size: 2
        panels: ["http-endpoints"]
  
  - name: "Git"
    rows:
      - size: 1
        panels: ["git-status"]
      - size: 2
        panels: ["git-commits"]

  - name: "History"
    rows:
      - size: 1
        panels: ["cpu-history", "memory-history"]
      - size: 2
        panels: ["disk-history", "http-history"]

  - name: "Notifications"
    rows:
      - size: 1
        panels: ["notifications"]

  - name: "Plugins"
    rows:
      - size: 1
        panels: ["plugins-list"]
      - size: 2
        panels: ["plugin-details"]

metrics:
  local:
    enabled: true
    
  endpoints:
    - name: "Example API"
      url: "https://example.com/api/health"
      method: "GET"
      interval: 30s
      alert:
        status_code: 200
        response_time: 500ms
  
  git:
    repositories:
      - path: "~/projects/main-service"
        remote: "origin"
        branch: "main"

plugins:
  directory: "plugins"
  enabled:
    - "sample"
  settings:
    sample:
      interval: "30s"
      threshold: 80

cloud:
  enabled: ["aws"]
  refresh: 1m
  aws:
    region: "us-west-2"
    additional_regions: ["us-east-1", "eu-west-1"]
    resources: ["ec2", "s3", "rds"]

kubernetes:
  enabled: true
  refresh: 30s
  namespaces: ["default", "kube-system"]
  resources: ["pods", "deployments", "services", "nodes"]

cicd:
  enabled: ["github"]
  refresh: 2m
  github:
    owner: "Teomazivila"
    repositories: ["maz-term"]
    workflows: ["ci.yml", "release.yml"] 