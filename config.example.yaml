# maz-term configuration
#
# Copy to one of the following and edit:
#   ./config.yaml
#   ~/.config/maz-term/config.yaml
#   /etc/maz-term/config.yaml
#
# Or pass a path explicitly: maz-term -config /path/to/config.yaml
#
# Every setting has exactly one home. Unknown keys are an error, so a typo is
# reported at startup rather than silently ignored.
#
# Any value can be overridden from the environment with a MAZTERM_ prefix and
# underscores for dots, for example:
#   MAZTERM_GENERAL_REFRESH=30s
#   MAZTERM_CLOUD_AWS_REGION=eu-west-1

general:
  # How often collectors sample and the dashboard redraws. Minimum 1s.
  refresh: 5s
  theme: default
  # How long history is kept. Accepts h, m, s plus d (days) and w (weeks).
  history_retention: 7d

# Tab layout. Either the shorthand panels list or the nested rows form works.
layout:
  - name: "System"
    panels: ["cpu", "memory", "disk", "processes"]
  - name: "HTTP"
    panels: ["http-endpoints"]
  - name: "Git"
    rows:
      - size: 1
        panels: ["git-status"]
      - size: 2
        panels: ["git-commits"]
  - name: "History"
    panels: ["history"]
  - name: "Notifications"
    panels: ["notifications"]
  - name: "Plugins"
    panels: ["plugins"]

# HTTP endpoints to health-check. Empty by default: maz-term contacts nothing
# unless you ask it to.
endpoints: []
# endpoints:
#   - name: "API gateway"
#     url: "https://api.example.com/health"
#     method: GET
#     # Considered up when the status matches. Omit to accept any 2xx.
#     expected_status: 200
#     timeout: 5s
#     headers:
#       X-Health-Probe: "maz-term"

git:
  repositories:
    # A leading ~ is expanded. "." means the working directory.
    - path: "."
      remote: origin
      branch: ""

# Plugins are native code executed inside this process.
#
# Loading requires a build with plugin support (make build-with-plugins) and an
# entry in allow: giving the SHA-256 of the shared object. An enabled plugin with
# no recorded digest is refused. `make sample-plugin` prints the digest to use.
plugins:
  directory: ""
  enabled: []
  allow: {}
  settings: {}
# plugins:
#   directory: "~/.config/maz-term/plugins"
#   enabled: ["sample"]
#   allow:
#     sample: "sha256:<digest printed by make sample-plugin>"
#   settings:
#     sample:
#       interval: "30s"

# Cloud, Kubernetes and CI/CD monitoring are disabled by default.
#
# Credentials are never read from this file. AWS uses the standard credential
# chain (AWS_* variables, a shared profile, or instance metadata) and GitHub
# reads MAZTERM_GITHUB_TOKEN or GITHUB_TOKEN. Placing access_key_id,
# secret_access_key or token here is rejected at startup.
cloud:
  enabled: []
  refresh: 1m
  aws:
    region: ""
    profile: ""
    additional_regions: []
    resources: ["ec2", "s3", "rds"]

kubernetes:
  enabled: false
  refresh: 30s
  # Defaults to $KUBECONFIG then ~/.kube/config when empty.
  config_path: ""
  context: ""
  namespaces: ["default"]
  resources: ["pods", "deployments", "services", "nodes"]

cicd:
  enabled: []
  refresh: 2m
  github:
    owner: ""
    repositories: []
    workflows: []
